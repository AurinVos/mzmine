def LINUX_INSTALLER_NAME = APPNAME + "_Linux_installer"
// installer options valid for both deb and rpm. Type specific options (--linux-deb-*, --linux-rpm-*)
// must not be mixed as jpackage rejects them since JDK 26 (previously only a warning).
def LINUX_COMMON_INSTALLER_OPTIONS = [
        "--vendor", "mzio GmbH",
        "--linux-package-name", APPNAME,
        "--linux-shortcut",
        "--linux-menu-group", APPNAME,
//      "--license-file", "LICENSE.txt", not required
]

/*
 * Build the JVM runtime using jlink
 */
runtime {
    // compress 6 is default for jlink
    options = ["--compress=zip-6", "--vm=server", "--no-header-files", "--no-man-pages", "--output", "jre/jre"]
    modules = [
            "java.desktop",
            "java.logging",
            "java.net.http",
            "java.rmi",
            "java.sql",
            "java.datatransfer",
            "java.management",
            "java.xml",
            "java.xml.crypto",
            "jdk.xml.dom",
            "java.naming",
            "java.transaction.xa",
            "java.scripting",
            "java.compiler",
            // jdk.jsobject was removed in JDK 26; netscape.javascript now ships in the javafx.web jar
            "jdk.jfr",
            "java.security.sasl",
            "java.security.jgss",
            "jdk.unsupported",
            "jdk.unsupported.desktop"
    ]
    if (OperatingSystem.current().isWindows()) {
        // only required on windows to access the trust store for root certificates
        modules.add("jdk.crypto.mscapi")
    }
    jpackage {
        if (OperatingSystem.current().isWindows()) {
            // The WiX toolset must be installed, see https://wixtoolset.org/releases/
            installerType = "msi"
            installerName = APPNAME + "_Windows_installer"
            // additional options for jpackage
            imageOptions = ["--icon", "src/main/resources/mzmineIcon.ico",
                            "--app-content", EXTERNAL_TOOLS_SRC,
                            "--add-launcher", APPNAME + "_console=gradle/win_console_launcher.properties"
            ]
            installerOptions = [
                    "--vendor", "mzio GmbH",
                    "--win-menu",
                    "--win-menu-group", APPNAME,
                    "--win-shortcut",
                    "--win-dir-chooser",
                    "--win-upgrade-uuid", "$win_uuid",
//                  "--license-file", "LICENSE.txt"  not required
            ]
        }
        if (OperatingSystem.current().isMacOsX()) {
//            installerType = "dmg"
            skipInstaller = true // no installer for macOS as we are generating it in GitHub action
            // additional options for jpackage
            // only sign if all needed information is present
            if (!macSigning) {
                imageOptions = [
                        "--vendor", "mzio GmbH",
                        "--icon", "src/main/resources/mzmineIcon.icns",
                        "--app-content", EXTERNAL_TOOLS_SRC
                ]
//                installerOptions = ["--license-file", "LICENSE.txt"] not required
                installerOptions = []
            } else {
                imageOptions = [
                        "--icon", "src/main/resources/mzmineIcon.icns",
                        "--app-content", EXTERNAL_TOOLS_SRC,
                        "--mac-sign",
                        "--mac-package-name", APPNAME,
                        "--mac-package-identifier", "io.github.mzmine.main",
                        "--mac-signing-key-user-name", developerID,
                        "--verbose"
                ]
                installerOptions = [
//                        "--license-file", "LICENSE.txt", not required
"--mac-sign",
"--mac-signing-key-user-name", developerID,
                ]
            }
            installerName = APPNAME + "_macOS_installer-academia"
        }
        if (OperatingSystem.current().isLinux()) {
            // decision: build only the deb here. With an empty installerType the beryx plugin runs
            // jpackage for rpm and deb with the same installerOptions, which fails on JDK 26 because
            // --linux-deb-maintainer is not valid for type rpm. The rpm is built by the jpackageRpm
            // task below from the same app image.
            // for rpm, rpmbuild and rpm tools need to be installed
            installerType = "deb"
            // additional options for jpackage
            imageOptions = ["--icon", "src/main/resources/mzmineIcon.png",
                            "--app-content", EXTERNAL_TOOLS_SRC]
            installerOptions = LINUX_COMMON_INSTALLER_OPTIONS + [
                    "--linux-deb-maintainer", "plusik@gmail.com"
            ]

            installerName = LINUX_INSTALLER_NAME
        }
        imageName = APPNAME
        jvmArgs = ["-showversion",
                   "-XX:MinHeapFreeRatio=50",
                   "-XX:MaxHeapFreeRatio=75",
                   "-XX:InitialRAMPercentage=5",
                   "-XX:MinRAMPercentage=75",
                   "-XX:MaxRAMPercentage=80",

                   "-XX:+UseG1GC", // pin GC
                   // give heap back to the OS while mzmine sits idle, after 10 minutes without GC
                   "-XX:G1PeriodicGCInterval=600000",
                   // JDK default pinned: concurrent cycle instead of a full GC, a full GC would freeze the UI on the
                   "-XX:+G1PeriodicGCInvokesConcurrent",
                   // spectral libraries, annotations, scan definitions, file names - duplicate strings
                   // let G1 deduplicate their char arrays
                   "-XX:+UseStringDeduplication",
                   "-XX:+UseCompactObjectHeaders",

                   "-enableassertions",
                   "-Djava.util.logging.config.class=io.github.mzmine.main.MZmineLoggingConfiguration",
                   "-Djava.net.useSystemProxies=true",
                   "--add-opens=java.logging/java.util.logging=ALL-UNNAMED",
                   "--enable-preview",
        ]
    }
}

/*
 * The rpm package on Linux. The beryx plugin can only pass a single installerOptions list to all
 * installer types it builds, so the rpm is created here from the app image of jpackageImage.
 */
if (OperatingSystem.current().isLinux()) {
    def jpackageOutputDir = layout.buildDirectory.dir("jpackage")
    def jpackageExecutable = javaToolchains.launcherFor(java.toolchain).map {
        it.metadata.installationPath.file("bin/jpackage").asFile.absolutePath
    }

    def jpackageRpm = tasks.register("jpackageRpm", Exec) {
        group = "build"
        description = "Creates the Linux rpm installer from the app image created by jpackageImage."
        dependsOn(tasks.named("jpackageImage"))

        def outputDir = jpackageOutputDir.get().asFile

        executable = jpackageExecutable.get()
        args(["--type", "rpm",
              "--dest", outputDir.absolutePath,
              "--name", LINUX_INSTALLER_NAME,
              "--app-version", project.version.toString(),
              "--app-image", new File(outputDir, APPNAME).absolutePath,
              *LINUX_COMMON_INSTALLER_OPTIONS])
    }

    // run after the deb so that both packages end up in build/jpackage
    tasks.named("jpackage") {
        finalizedBy(jpackageRpm)
    }
}

def signApp = tasks.register("signApp") {
    // see all the way at bottomn. Maybe this needs to run before or as finish jpackageImage
    // that should be the task that does the .app
    // then jpackage will be able to just create the dmg and notarize without the additional python dependency
    dependsOn(tasks.jpackage)

    if (OperatingSystem.current().isMacOsX() && macSigning) {

        doLast {
            def execOps = project.services.get(ExecOperations)
            Path entitlementsPth = layout.projectDirectory.dir('gradle/macos.entitlements').asFile.toPath()
            getLogger().info("imageDir " + imageDir)
            getLogger().info("jarsDir " + jarsDir)
            getLogger().info("jarsDir file " + jarsDir.toFile())
            getLogger().info("entitlementsPth " + entitlementsPth)

            // Define codesign commands
//            TODO should remove deep option from all codesign as it is deprecated since macOS 13
            Consumer<Path> codesignWithEntitlements = { Path p ->
                execOps.exec {
                    commandLine(["codesign", "--deep", "--force", "--timestamp", "-s", "${developerID}", "--options",
                                 "runtime", "--entitlements", "${entitlementsPth}", "-f", "-v", "${p}"])
                }
            }
            Consumer<Path> codesignRuntimeOnly = { Path p ->
                execOps.exec {
                    commandLine(["codesign", "--force", "--timestamp", "-s", "${developerID}", "--options",
                                 "runtime", "-v", "${p}"])
                }
            }

            // Clear any quarantine attributes on the entire app before signing
            try {
                execOps.exec {
                    commandLine(['xattr', '-r', '-d', 'com.apple.quarantine', imageDir.toFile().absolutePath])
                    ignoreExitValue = true
                }
            } catch (Exception ignored) {
                // best-effort; continue
            }

            getLogger().lifecycle('Deleting unused "non-notarizable" libraries...')

            // Delete unused dependencies of dependencies causing notarization issues
            jarsDir.toFile()
                    .listFiles({ File d, String n -> n.startsWith('netlib') || n.startsWith('jblas') || n.startsWith('jocl') } as FilenameFilter)
                    ?.each { File f -> f.delete() }

            getLogger().lifecycle("Signing native libraries...")

            // Traverse over whole .app and sign each native library
            Path runtimeDir = imageDir.resolve('Contents').resolve('runtime')
            Files.find(imageDir, 999, { p, bfa ->
                bfa.isRegularFile() && p.getFileName().toString().matches(".*\\.dylib|.*\\.so|.*\\.dll|.*\\.a|.*\\.lib") &&
                        !p.toAbsolutePath().startsWith(runtimeDir.toAbsolutePath())
            } as BiPredicate)
                    .forEach { Path nativeLib ->
                        getLogger().lifecycle("Signing native lib '${nativeLib}'")
                        codesignRuntimeOnly(nativeLib.toAbsolutePath())
                    }

            getLogger().lifecycle("Signing libraires nested in jars...")

            // Dynamically find and sign all native libraries in JARs
            Path tmpJarsDir = layout.buildDirectory.dir("tmp/jarLibs").get().asFile.toPath()
            Files.createDirectories(tmpJarsDir)

            // Find all JAR files in the app directory
            jarsDir.toFile().listFiles().findAll { it.name.endsWith('.jar') }.each { jarFile ->
                getLogger().lifecycle("Processing jar for native libraries: ${jarFile.name}")
                FileSystem jarFs = null
                try {
                    jarFs = FileSystems.newFileSystem(jarFile.toPath(), [:])
                    // Find all native libraries in this JAR
                    Files.walk(jarFs.getPath("/")).forEach({ path ->
                        if (path.getFileName().toString().matches(".*\\.(dylib|jnilib|so|dll)")) {
                            getLogger().lifecycle("Found native library in ${jarFile.name}: ${path}")
                            Path tmpPath = tmpJarsDir.resolve(jarFile.name + "_" + path.getFileName().toString())
                            Files.copy(path, tmpPath, StandardCopyOption.REPLACE_EXISTING)
                            codesignRuntimeOnly(tmpPath.toAbsolutePath())
                            Files.copy(tmpPath, path, StandardCopyOption.REPLACE_EXISTING)
                        }
                    } as Consumer)
                } finally {
                    try {
                        jarFs?.close()
                    } catch (Exception ignored) {
                    }
                }
            }

            getLogger().lifecycle("Signing jars...")

            // Traverse over entire .app and sign each .jar
            Files.find(imageDir, 999, { p, bfa ->
                bfa.isRegularFile() && p.getFileName().toString().matches(".*\\.jar")
            } as BiPredicate)
                    .forEach { Path jar ->
                        getLogger().lifecycle("Signing jar '${jar}'")
                        codesignRuntimeOnly(jar.toAbsolutePath())
                    }

            // delete duplicated libs
            //jarsDir.resolveSibling('runtime/Contents/MacOS').resolve("libjli.dylib").toFile().delete()

            // Sign .app directory
            getLogger().lifecycle("Signing .app directory...")
            // Sign the .app with entitlements last
            codesignWithEntitlements(imageDir)
        }
    }
}

tasks.register('notarizeApp') {
    dependsOn(signApp)
    if (OperatingSystem.current().isMacOsX() && macSigning) {
        doLast {
            def execOps = project.services.get(ExecOperations)
            File jpackageDir = layout.buildDirectory.dir("jpackage").get().asFile
            File dmgFile = new File(jpackageDir, APPNAME + "_macOS_installer_academia.dmg")
            File appBundle = new File(jpackageDir, APPNAME + ".app")

            // Install appdmg if not already installed
            getLogger().lifecycle("Installing appdmg...")
            execOps.exec {
                commandLine(['npm', 'install', '--python=python3.11', '-g', 'appdmg'])
                ignoreExitValue = true // In case it's already installed
            }

            // Create DMG using appdmg with the existing configuration
            getLogger().lifecycle("Creating DMG with appdmg...")
            execOps.exec {
                commandLine(['appdmg',
                             "${layout.projectDirectory.dir('gradle/appdmg.json').asFile.absolutePath}",
                             APPNAME + "_macOS_installer_academia.dmg"])
                workingDir jpackageDir
            }

            // Sign the DMG itself
            getLogger().lifecycle("Signing DMG...")
            execOps.exec {
                commandLine(['codesign', '--force', '--sign', "${developerID}", '--timestamp',
                             '--options', 'runtime', dmgFile.name])
                workingDir jpackageDir
            }

            getLogger().lifecycle("Notarizing DMG...")
            // Notarize the DMG
            ByteArrayOutputStream notaryStdout = new ByteArrayOutputStream()
            ByteArrayOutputStream notaryStderr = new ByteArrayOutputStream()
            ExecResult execResult = execOps.exec {
                commandLine(["xcrun", "notarytool", "submit", "--wait", "--apple-id", "${appleID}",
                             "--password", "${appleIDPassword}", "--team-id", "${appleTeamID}",
                             dmgFile.absolutePath])
                standardOutput = notaryStdout
                errorOutput = notaryStderr
                ignoreExitValue = true
            }
            String notaryOut = new String(notaryStdout.toByteArray(), StandardCharsets.UTF_8)
            String notaryErr = new String(notaryStderr.toByteArray(), StandardCharsets.UTF_8)
            if (!notaryOut.isBlank()) {
                getLogger().lifecycle(notaryOut.trim())
            }
            if (execResult.getExitValue() != 0 ||
                    !notaryOut.toLowerCase(Locale.US).contains("status: accepted")) {
                throw new GradleException("Notarization failed (exit ${execResult.getExitValue()}). Output:\n${notaryOut}\n${notaryErr}")
            }

            getLogger().lifecycle("Stapling DMG...")
            // Staple the DMG directly (try with --force if regular stapling fails)
            ExecResult staplerResult = execOps.exec {
                commandLine(["xcrun", "stapler", "staple", dmgFile.absolutePath])
                ignoreExitValue = true
            }
            if (staplerResult.getExitValue() != 0) {
                throw new GradleException("Stapling DMG failed with exit ${staplerResult.getExitValue()}.")
            }

            getLogger().lifecycle("Stapling app bundle...")
            ExecResult appStapleResult = execOps.exec {
                commandLine(["xcrun", "stapler", "staple", appBundle.absolutePath])
                ignoreExitValue = true
            }
            if (appStapleResult.getExitValue() != 0) {
                getLogger().warn("Stapling app bundle failed (exit ${appStapleResult.getExitValue()}). Falling back to online ticket lookup.")
            } else {
                execOps.exec {
                    commandLine(['/usr/sbin/spctl', '--assess', '--type', 'exec', '--verbose=4', appBundle.absolutePath])
                    ignoreExitValue = true
                }
            }

            // Also create portable ZIP from the original .app for those who want it
            getLogger().lifecycle("Creating portable ZIP...")
            execOps.exec {
                commandLine(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent',
                             APPNAME + '.app', APPNAME + '_macOS_portable_academia.zip'])
                workingDir jpackageDir
            }

            getLogger().lifecycle("DMG notarization complete!")
        }
    }
}

/*
 * This is important in order to copy all .java, .fxml, and help files into the final MZmine jar.
 * The .java files are only for people who want to check the source codes.
 * But the .fxml and help files are required for the GUI.
 */
jar {
    sourceSets.main.resources.srcDirs += ["src/main/java"]
}

tasks.named('processResources') {
    from(rootProject.file('licenses')) { into 'licenses' }
    from(rootProject.file('LICENSE.txt')) { into 'licenses' }
    // Vendor integration documentation may stay in the repo, payloads may not enter the JAR.
    exclude 'vendorlib/**'
    doFirst {
        // ProcessResources is a Copy task; exclusion alone leaves files from old builds.
        delete layout.buildDirectory.dir('resources/main/vendorlib').get().asFile
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    jvmArgs += [
            // need to activate the mockito agent
            "-javaagent:${classpath.find { it.name.contains('mockito-core') || it.name.contains('mockito-inline') }}"
    ]
}

var copyTestResources = tasks.register("copyTestResources", Copy) {
    from layout.projectDirectory.dir("src/test/resources")
    into layout.buildDirectory.dir("classes/test")
}
processTestResources.dependsOn(copyTestResources)

licenseReport {
    // By default this plugin will collect the union of all licenses from
    // the immediate pom and the parent poms. If your legal team thinks this
    // is too liberal, you can restrict collected licenses to only include the
    // those found in the immediate pom file
    // Defaults to: true
    unionParentPomLicenses = true

    // Set output directory for the report data.
    // Defaults to ${project.buildDir}/reports/dependency-license.
    outputDir = getLayout().getBuildDirectory().get().dir("licensereport")
//    outputDir = getLayout().getProjectDirectory().dir("licensereport")

    // Adjust the configurations to fetch dependencies. Default is 'runtimeClasspath'
    // For Android projects use 'releaseRuntimeClasspath' or 'yourFlavorNameReleaseRuntimeClasspath'
    // Use 'ALL' to dynamically resolve all configurations:
    // configurations = ALL
    configurations = ['runtimeClasspath']

    // Don't include artifacts of project's own group into the report
    excludeOwnGroup = true

    // No runtime artifacts are silently omitted from license checking.
    excludes = []

    // Don't exclude bom dependencies.
    // If set to true, then all boms will be excluded from the report
    excludeBoms = false

    filters = [new LicenseBundleNormalizer(bundlePath: "$projectDir/config/license-normalizer-bundle.json", createDefaultTransformationRules: false)]
    renderers = [new JsonReportRenderer("licenses.json"), new CsvReportRenderer("licenses.csv"),
                 new InventoryHtmlReportRenderer('licenses.html', 'Licenses')]

    allowedLicensesFile = new File("$projectDir/config/allowed-licenses.json")

    // if a project contains a dependency we are not allowed to use, we can use
    // "gradlew mzmine-community:dependencies" to generate a dependency graph
}
tasks.register('copyLicenseInformationToResources', Copy) {
    outputs.upToDateWhen { false }
    dependsOn(checkLicense)
    from(getLayout().getBuildDirectory().get().dir("/licensereport"))
    into(getLayout().getProjectDirectory().dir("/src/main/resources/dependency/"))
    include("project-licenses-for-check-license-task.json")
    rename("project-licenses-for-check-license-task.json", "dependency-licenses.json")
}
tasks.register('copyLicenseInformationToBuild', Copy) {
    outputs.upToDateWhen { false }
    dependsOn(checkLicense)
    from(getLayout().getBuildDirectory().get().dir("/licensereport"))
    into(getLayout().getBuildDirectory().get().dir("/resources/main/dependency/"))
    include("project-licenses-for-check-license-task.json")
    rename("project-licenses-for-check-license-task.json", "dependency-licenses.json")
}

// compileJava does not actually depend on this but we want to fail the build if there are invalid licenses
tasks.compileJava.dependsOn(checkLicense, copyLicenseInformationToResources, copyLicenseInformationToBuild)
// copying must be finished before packaging
tasks.processResources.dependsOn(copyLicenseInformationToResources, copyLicenseInformationToBuild)
tasks.named('generateLicenseReport') {
    inputs.file('config/license-normalizer-bundle.json')
}
tasks.named('checkLicense') {
    inputs.file('config/allowed-licenses.json')
}

