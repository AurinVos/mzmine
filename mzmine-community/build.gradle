/*
 * Set the basic Java runtime parameters (heap size etc.)
 */
application {
    mainClass.set("io.github.mzmine.main.MZmineCore")
    applicationName = APPNAME
    applicationDefaultJvmArgs = [
            // https://github.com/controlsfx/controlsfx/wiki/Using-ControlsFX-with-JDK-9-and-above
            "--add-exports=javafx.base/com.sun.javafx.event=org.controlsfx.controls",
            "--add-exports=javafx.graphics/com.sun.javafx.scene=org.controlsfx.controls",
            "--add-exports=javafx.graphics/com.sun.javafx.scene.traversal=org.controlsfx.controls",
            "--add-opens=javafx.controls/javafx.scene.control.skin=org.controlsfx.controls",
            "--add-exports=javafx.graphics/com.sun.javafx.css=org.controlsfx.controls",
            "--add-opens=javafx.controls/javafx.scene.control.skin=org.controlsfx.controls",
            "--add-exports=javafx.graphics/com.sun.javafx.scene=org.controlsfx.controls",
            "--add-exports=javafx.graphics/com.sun.javafx.scene.traversal=org.controlsfx.controls",
            "--add-opens=javafx.controls/javafx.scene.control.skin=org.controlsfx.controls",
            // required for getting log file
            '--add-opens=java.logging/java.util.logging=ALL-UNNAMED',

            "-XX:+UseG1GC", // pin GC
            // give heap back to the OS while mzmine sits idle, after 10 minutes without GC
            "-XX:G1PeriodicGCInterval=600000",
            // JDK default pinned: concurrent cycle instead of a full GC, a full GC would freeze the UI on the
            "-XX:+G1PeriodicGCInvokesConcurrent",
            // spectral libraries, annotations, scan definitions, file names - duplicate strings
            // let G1 deduplicate their char arrays
            "-XX:+UseStringDeduplication",
            "-XX:+UseCompactObjectHeaders",

            // logging
            "-Djava.util.logging.config.class=io.github.mzmine.main.MZmineLoggingConfiguration"
    ]
}

