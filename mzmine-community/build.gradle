// make sure the publish action is run after the semver plugin has been evaluated,
// otherwise the version will always be 1.0.0
afterEvaluate {
    publishing {
        publications {
            register("mzmine-community-package", MavenPublication) {
                from(components["java"])
                pom {
                    name = "mzmine-community"
                    description = "mzmine-community"
                    artifactId = "mzmine-community"
                    url = "https://github.com/mzmine/mzmine"
                    version = semver.version
                    developers {
                        developer {
                            id = "mzmine"
                            name = "mzmine"
                        }
                    }
                }
            }

            register("versionCatalog", MavenPublication) {
                from(components["versionCatalog"])
                version = semver.version
                artifactId = 'mzmine-community-version-catalog'
                // This is important so the published artifact registers as a .toml file, rather than a library
            }
        }
    }
}



// Prevent proprietary runtime dependencies from returning unnoticed.
tasks.register('verifyOpenRuntime') {
    group = 'verification'
    description = 'Verifies removed runtime dependencies, source references and vendor payloads.'
    doLast {
        def forbiddenArtifacts = configurations.runtimeClasspath.resolvedConfiguration
                .resolvedArtifacts.findAll {
                    def id = it.moduleVersion.id
                    id.group == 'io.mzio' ||
                            (id.group == 'com.alanmrace' && !(id.name == 'jimzmlparser' && id.version == '1.0.3')) ||
                            id.group == 'junit' ||
                            id.group == 'colt' || id.group == 'net.jcip' || id.name == 'jjobs-core' || id.name == 'xmpcore' ||
                            id.name == 'grpc-netty-shaded' || id.name.startsWith('netty-tcnative') ||
                            (id.group == 'org.json' && id.version != '20240303') ||
                            id.version.endsWith('-SNAPSHOT')
                }
        if (!forbiddenArtifacts.isEmpty()) {
            throw new GradleException("Restricted or unverified runtime artifacts found: ${forbiddenArtifacts}")
        }
        def forbiddenImports = fileTree('src/main/java') {
            include '**/*.java', '**/*.kt'
        }.findAll { it.text.contains('io.mzio') }
        if (!forbiddenImports.isEmpty()) {
            throw new GradleException("Proprietary io.mzio references found: ${forbiddenImports}")
        }
        def forbiddenFiles = [
                '../local-repo/io/mzio',
                '../external_tools/bruker_baf/baf2sql_c.dll',
                '../external_tools/bruker_baf/libbaf2sql_c.so',
                '../external_tools/sciex_wiff2/Wiff2Launcher.dll',
                '../external_tools/sciex_wiff2/libWiff2Launcher.so',
                '../external_tools/waters_raw/MLReader.dll',
                '../external_tools/waters_raw/MassLynxRaw.dll',
                'src/main/resources/vendorlib/bruker/timsdata_x64.dll',
                'src/main/resources/vendorlib/bruker/libtimsdata.so'
        ].collect { file(it) }.findAll { it.exists() }
        if (!forbiddenFiles.isEmpty()) {
            throw new GradleException("Proprietary binary files found: ${forbiddenFiles}")
        }
    }
}

tasks.named('check') {
    dependsOn(tasks.named('verifyOpenRuntime'))
}

apply from: "$projectDir/gradle/release-compliance.gradle"
